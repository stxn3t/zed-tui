name: Build Zed TUI (Linux)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"

concurrency:
  group: zed-tui-build
  cancel-in-progress: true

jobs:
  build:
    if: github.repository_owner != 'zed-industries'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      # Faster CI builds than the official release profile; the result is still optimized.
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_DEBUG: "false"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: ./script/linux

      - name: Install Rust toolchain
        run: rustup show

      - name: Build
        run: cargo build --release --package zed --bin zed

      - name: Package
        run: |
          mkdir -p dist/zed-tui
          cp target/release/zed dist/zed-tui/zed-tui
          cp crates/zed/resources/app-icon.png dist/zed-tui/zed-tui.png
          cat > dist/zed-tui/zed-tui.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Zed TUI
          Comment=Zed with a terminal-style UI
          Exec=zed-tui %U
          Icon=zed-tui
          Categories=Utility;TextEditor;Development;
          MimeType=text/plain;inode/directory;
          Terminal=false
          EOF
          sed -i 's/^ *//' dist/zed-tui/zed-tui.desktop
          tar -czf zed-tui-linux-x86_64.tar.gz -C dist zed-tui

      - uses: actions/upload-artifact@v4
        with:
          name: zed-tui-linux-x86_64
          path: zed-tui-linux-x86_64.tar.gz
          retention-days: 30
